<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>进化战争 · 画风参考</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #181b21;
      color: #f1f0eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: auto; padding: 28px clamp(14px, 4vw, 60px) 52px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 5vw, 46px); letter-spacing: .03em; }
    h2 { font-size: clamp(19px, 3vw, 26px); margin-bottom: 14px; }
    header p { margin: 7px 0 27px; color: #c9c9c4; font-size: .92rem; }
    section + section { margin-top: 32px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; overflow: hidden; background: #23262f; border: 1px solid #424755; border-radius: 9px; }
    .shot { display: block; background: #101116; }
    .shot img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; }
    .shot:hover img { filter: brightness(1.12); }
    .shot:focus-visible { outline: 2px solid #facb81; outline-offset: -3px; }
    figcaption { padding: 12px 13px 14px; }
    h3 { font-size: 1.05rem; }
    .style { display: block; margin-top: 3px; color: #facb81; font-size: .82rem; }
    .note { margin: 7px 0; color: #ddddda; font-size: .9rem; line-height: 1.55; }
    .source { color: #d0dfff; font-size: .78rem; text-underline-offset: 3px; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>游戏画风参考</h1><p>13 张官方实机图与设定图，点图可放大。</p></header>
    <section>
      <h2>先看这三种</h2>
      <div class="grid">
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/985890/ss_de2ffc96c3640f57e84094c6cb2df3d9db0e3bc1.jpg?t=1763718423" target="_blank" rel="noopener noreferrer" aria-label="放大《怒之铁拳 4》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/985890/ss_de2ffc96c3640f57e84094c6cb2df3d9db0e3bc1.600x338.jpg?t=1763718423" alt="《怒之铁拳 4》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>怒之铁拳 4</h3><span class="style">动态漫画</span><p class="note">看站姿、前后排和出手的力度。</p><a class="source" href="https://www.lizardcube.com/presskit/StreetsofRage4/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://unicorn-overlord.com/en/resources/img/top/about_ss1_bf9a5d3f834fe81d00c80fa611fd66e1.jpg" target="_blank" rel="noopener noreferrer" aria-label="放大《圣兽之王》"><img src="https://unicorn-overlord.com/en/resources/img/top/about_ss1_bf9a5d3f834fe81d00c80fa611fd66e1.jpg" alt="《圣兽之王》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>圣兽之王</h3><span class="style">奇幻战争</span><p class="note">看战役地图、部队标记和阵营气质。</p><a class="source" href="https://unicorn-overlord.com/en/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1809540/ss_514e766f27fcfccf375c85a842099d53e9542258.jpg?t=1782464830" target="_blank" rel="noopener noreferrer" aria-label="放大《九日》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1809540/ss_514e766f27fcfccf375c85a842099d53e9542258.600x338.jpg?t=1782464830" alt="《九日》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>九日</h3><span class="style">东方手绘</span><p class="note">看山形、屋檐和红色树冠怎样形成一个世界。</p><a class="source" href="https://store.steampowered.com/app/1809540/Nine_Sols/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>角色与打斗</h2>
      <div class="grid">
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/703880/ss_85974b71bf25d7a92f94099119685d39f0da30e7.jpg?t=1715018131" target="_blank" rel="noopener noreferrer" aria-label="放大《Swords &amp; Soldiers II》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/703880/ss_85974b71bf25d7a92f94099119685d39f0da30e7.600x338.jpg?t=1715018131" alt="《Swords &amp; Soldiers II》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>Swords &amp; Soldiers II</h3><span class="style">夸张卡通</span><p class="note">看横向对推时的小兵、武器和建筑剪影。</p><a class="source" href="https://store.steampowered.com/app/703880/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1313140/ss_b26625d6f64a739ed1ddf832a5d26b665ab0619f.jpg?t=1786554901" target="_blank" rel="noopener noreferrer" aria-label="放大《咩咩启示录》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1313140/ss_b26625d6f64a739ed1ddf832a5d26b665ab0619f.600x338.jpg?t=1786554901" alt="《咩咩启示录》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>咩咩启示录</h3><span class="style">暗黑 Q 版</span><p class="note">看小比例角色如何放进有气氛的环境。</p><a class="source" href="https://influencers.devolverdigital.com/cult-of-the-lamb" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://assets.nintendo.com/image/upload/q_auto/f_auto/c_fill,w_813/dpr_2.0/ncom/en_US/articles/2023/ask-the-developer-vol-8-fire-emblem-engage/Inserted/InsertedImage_17_EN" target="_blank" rel="noopener noreferrer" aria-label="放大《火焰纹章 Engage》"><img src="https://assets.nintendo.com/image/upload/q_auto/f_auto/c_fill,w_813/dpr_2.0/ncom/en_US/articles/2023/ask-the-developer-vol-8-fire-emblem-engage/Inserted/InsertedImage_17_EN" alt="《火焰纹章 Engage》角色设定图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>火焰纹章 Engage</h3><span class="style">二次元设定图</span><p class="note">看服装的主色、强调色和不同人物的比例。</p><a class="source" href="https://www.nintendo.com/us/whatsnew/ask-the-developer-vol-8-fire-emblem-engage-part-2/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1811990/ss_d7ed2146d858a0abd02a8256befe264328595537.jpg?t=1778084209" target="_blank" rel="noopener noreferrer" aria-label="放大《Wildfrost》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1811990/ss_d7ed2146d858a0abd02a8256befe264328595537.600x338.jpg?t=1778084209" alt="《Wildfrost》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>Wildfrost</h3><span class="style">绘本卡通</span><p class="note">看小头像里的帽子、围巾和兵种识别。</p><a class="source" href="https://www.wildfrostgame.com/presskit/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145350/ss_ef0f63061d0a0a9a7e46f3b84f125d25330e8f19.jpg?t=1779901265" target="_blank" rel="noopener noreferrer" aria-label="放大《黑帝斯 II》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1145350/ss_ef0f63061d0a0a9a7e46f3b84f125d25330e8f19.600x338.jpg?t=1779901265" alt="《黑帝斯 II》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>黑帝斯 II</h3><span class="style">暗色战场</span><p class="note">看少量亮色如何突出招式和击中。</p><a class="source" href="https://www.supergiantgames.com/games/hades-ii/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2396240/ss_19c1be291bc0e198b7d6199f536e699399977c3c.jpg?t=1759330639" target="_blank" rel="noopener noreferrer" aria-label="放大《SteamWorld Heist II》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/2396240/ss_19c1be291bc0e198b7d6199f536e699399977c3c.600x338.jpg?t=1759330639" alt="《SteamWorld Heist II》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>SteamWorld Heist II</h3><span class="style">机械卡通</span><p class="note">看工业场景里的铁件、管线和暖色光源。</p><a class="source" href="https://store.steampowered.com/app/2396240/SteamWorld_Heist_II/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
      </div>
    </section>
    <section>
      <h2>场景与时代</h2>
      <div class="grid">
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/757310/ss_f7cf5d40340dfcfc534daff63be314fdbb9e6817.jpg?t=1792068075" target="_blank" rel="noopener noreferrer" aria-label="放大《Sable》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/757310/ss_f7cf5d40340dfcfc534daff63be314fdbb9e6817.600x338.jpg?t=1792068075" alt="《Sable》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>Sable</h3><span class="style">线描平涂</span><p class="note">看开阔地表怎样衬出地标。</p><a class="source" href="https://rawfury.com/games/sable/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/587620/ss_71f6af1f989df2aa6bc4e07a9ae407609c264b2e.jpg?t=1733787035" target="_blank" rel="noopener noreferrer" aria-label="放大《大神》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/587620/ss_71f6af1f989df2aa6bc4e07a9ae407609c264b2e.600x338.jpg?t=1733787035" alt="《大神》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>大神</h3><span class="style">水墨色块</span><p class="note">看水面、坡地和建筑怎样共享笔触。</p><a class="source" href="https://store.steampowered.com/app/587620/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1121640/577c727eea7a4128927bc30a049baf0825bc7cfa/ss_577c727eea7a4128927bc30a049baf0825bc7cfa.jpg?t=1792413930" target="_blank" rel="noopener noreferrer" aria-label="放大《The Wandering Village》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1121640/577c727eea7a4128927bc30a049baf0825bc7cfa/ss_577c727eea7a4128927bc30a049baf0825bc7cfa.600x338.jpg?t=1792413930" alt="《The Wandering Village》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>The Wandering Village</h3><span class="style">手绘与立体地形</span><p class="note">看小比例建筑怎样落在立体环境上。</p><a class="source" href="https://strayfawnstudio.com/presskit/sheet.php?p=the_wandering_village" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
        <figure>
          <a class="shot" href="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/957960/ss_cc5a4634d9528e4b9506bba58c05ea25897884c5.jpg?t=1793973322" target="_blank" rel="noopener noreferrer" aria-label="放大《神笔谈兵》"><img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/957960/ss_cc5a4634d9528e4b9506bba58c05ea25897884c5.600x338.jpg?t=1793973322" alt="《神笔谈兵》游戏截图" referrerpolicy="no-referrer" width="600" height="338"></a>
          <figcaption><h3>神笔谈兵</h3><span class="style">古书插画</span><p class="note">看书页、角色与边框怎样共享同一种画法。</p><a class="source" href="https://store.steampowered.com/app/957960/Inkulinati/" target="_blank" rel="noopener noreferrer">官方来源</a></figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
